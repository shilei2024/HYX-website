# HTTPS：与 HTTP 配置使用同一持久化数据、备份及账号目录。
services:
  hyx-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: hyx-website:latest
    container_name: hyx-website
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      # 覆盖仓库中的初始内容；运营数据只来自独立持久化目录。
      - ${HYX_DATA_DIR:-../hyx-website-data}/content:/srv/content:ro
      - ${HYX_DATA_DIR:-../hyx-website-data}/uploads:/srv/uploads:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./logs:/var/log/nginx
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    depends_on:
      hyx-admin:
        condition: service_healthy
    networks:
      - hyx-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  hyx-admin:
    image: node:24-alpine
    container_name: hyx-admin
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=3000
      - NODE_ENV=production
      - TRUST_PROXY=true
      - SITE_DIR=/srv/app/site
      - HYX_DATA_DIR=/srv/persistent
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-hyx@2026}
      - SESSION_TTL_HOURS=24
    volumes:
      # 首次启动自动迁移旧版 server-data/ 或 server/data/ 中的账号及备份。
      - .:/srv/app:ro
      - ${HYX_DATA_DIR:-../hyx-website-data}:/srv/persistent
    command: node /srv/app/server/server.js
    networks:
      - hyx-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  hyx-backup:
    image: node:24-alpine
    container_name: hyx-backup
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - SITE_DIR=/srv/app/site
      - HYX_DATA_DIR=/srv/persistent
      - HYX_BACKUP_DIR=/srv/backups
      - BACKUP_TIME=${BACKUP_TIME:-03:00}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-30}
    volumes:
      - .:/srv/app:ro
      - ${HYX_DATA_DIR:-../hyx-website-data}:/srv/persistent:ro
      - ${HYX_BACKUP_DIR:-../hyx-website-backups}:/srv/backups
    command: node /srv/app/server/backup.js --schedule
    healthcheck:
      test: ["CMD", "node", "/srv/app/server/backup.js", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      hyx-admin:
        condition: service_healthy
    networks:
      - hyx-network

networks:
  hyx-network:
    driver: bridge
