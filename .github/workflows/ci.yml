name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: 数据、代码与持久化测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 校验 JSON、JavaScript 和 Bash
        run: |
          node -e "const fs=require('fs'),path=require('path');function scan(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())scan(p);else if(p.endsWith('.json'))JSON.parse(fs.readFileSync(p,'utf8'));}}scan('site/data');"
          for file in server/*.js site/js/*.js site/admin/js/*.js; do node --check "$file"; done
          for file in *.sh test/*.sh; do bash -n "$file"; done
          docker compose config --quiet
          docker compose -f docker-compose-https.yml config --quiet
      - name: 验证页面、迁移、认证、备份、恢复和三语言表单
        run: node --test test/persistence.test.js test/site.test.js
  deployment:
    name: Docker ${{ matrix.mode }} 部署与恢复
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [http, https]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash test/docker-deployment.sh ${{ matrix.mode }}
