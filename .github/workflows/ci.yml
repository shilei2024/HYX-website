# 官网基础 CI：校验数据 JSON 合法性与服务端/后台脚本语法
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: 校验 JSON 数据与 JS 语法
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 使用 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 校验所有数据 JSON 文件
        run: |
          fail=0
          for f in $(find site/data -name '*.json'); do
            if ! node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "::error file=$f::JSON 解析失败"
              fail=1
            else
              echo "OK  $f"
            fi
          done
          exit $fail

      - name: 校验服务端与前端脚本语法
        run: |
          node --check server/server.js
          node --check site/js/data-loader.js
          node --check site/js/components.js
          node --check site/admin/js/admin.js

      - name: 冒烟测试：后台服务可启动
        run: |
          node server/server.js &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://localhost:3000/api/health | grep -q '"ok":true' \
            || { echo "::error::健康检查失败"; kill $SERVER_PID; exit 1; }
          curl -fsS http://localhost:3000/admin/ | grep -q '内容管理后台' \
            || { echo "::error::后台页面加载失败"; kill $SERVER_PID; exit 1; }
          kill $SERVER_PID
          echo "冒烟测试通过"
