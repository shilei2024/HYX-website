version: '3.8'

services:
  # 企业官网服务（支持 Docker Compose Watch 自动同步）
  hyx-website:
    build:
      context: .
      dockerfile: Dockerfile
    image: hyx-website:latest
    container_name: hyx-website
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # 挂载网站文件（Watch 模式自动同步）
      - ./site:/usr/share/nginx/html:ro
      - ./logs:/var/log/nginx
    environment:
      - TZ=Asia/Shanghai
    networks:
      - hyx-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    develop:
      watch:
        # 静态文件同步模式（git pull 后自动生效，无需手动 sync）
        - path: ./site/
          action: sync
          target: /usr/share/nginx/html
          ignore:
            - logs/
            - .git/
            - node_modules/
        # Nginx 配置文件同步
        - path: ./nginx-docker.conf
          action: sync+restart
          target: /etc/nginx/conf.d/default.conf

  # 内容管理 API 服务（后台读写 site/data/*.json 与图片上传）
  hyx-admin:
    image: node:20-alpine
    container_name: hyx-admin
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=3000
      - SITE_DIR=/srv/site
      # 初始管理员账号（首次启动生成，之后请在后台修改密码）
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=hyx@2026
      - SESSION_TTL_HOURS=24
    volumes:
      # 站点目录读写（保存 JSON 数据与上传图片）
      - ./site:/srv/site
      # 管理服务代码（只读）
      - ./server:/srv/server:ro
      # 服务数据持久化（用户文件与内容备份，含后台修改后的密码）
      - ./server-data:/srv/server/data
    command: node /srv/server/server.js
    networks:
      - hyx-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # HTTPS 反向代理（可选，需要配置 SSL 证书）
  # hyx-https:
  #   image: nginx:alpine
  #   container_name: hyx-https
  #   restart: unless-stopped
  #   ports:
  #     - "443:443"
  #   volumes:
  #     - ./ssl:/etc/nginx/ssl:ro
  #     - ./nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - hyx-website
  #   networks:
  #     - hyx-network

networks:
  hyx-network:
    driver: bridge

# 数据卷（可选）
volumes:
  logs: