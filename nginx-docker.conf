# 弘易芯科技官网 - Docker Nginx 配置（HTTP 版本）
# 用于首次部署和 SSL 证书申请

server {
    listen 80;
    server_name hyic-tech.com www.hyic-tech.com;
    
    # 网站根目录
    root /usr/share/nginx/html;
    index index.html;
    
    # 主路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 内容管理 API（转发至 hyx-admin 服务）
    location ^~ /api/ {
        proxy_pass http://hyx-admin:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 图片以 Base64 提交，放宽请求体限制
        client_max_body_size 12m;
    }

    # 内容数据 JSON 不缓存，保证后台修改后前台立即生效
    location ~* \.json$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # Let's Encrypt 验证路径
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }
    
    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";
    
    # 静态资源缓存（JSON 已由上方规则单独处理为不缓存）
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 错误页面
    error_page 404 /index.html;
}