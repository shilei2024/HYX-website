<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <meta name="description" content="弘易芯科技 - 专业电子元器件授权代理商/分销商">
  <title>弘易芯科技 - 电子元器件授权代理商</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="site-header" id="hyx-header"></header>

  <section class="banner-section">
    <div id="hero-carousel"></div>
  </section>

  <section class="quick-entry">
    <div class="container">
      <div class="row g-4">
        <div class="col-md-6 col-lg-3">
          <a href="products/brands.html" class="text-decoration-none">
            <div class="card">
              <div class="card-body">
                <div class="card-icon">&#127970;</div>
                <h5 class="card-title" data-i18n="home.authorizedAgent">授权代理</h5>
                <p class="card-text" data-i18n="home.authorizedAgentDesc">品牌授权与正品保障</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-md-6 col-lg-3">
          <a href="products/distribution.html" class="text-decoration-none">
            <div class="card">
              <div class="card-body">
                <div class="card-icon">&#128230;</div>
                <h5 class="card-title" data-i18n="home.productCenter">产品中心</h5>
                <p class="card-text" data-i18n="home.productCenterDesc">代理品牌与分销品牌</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-md-6 col-lg-3">
          <a href="products/diagrams.html" class="text-decoration-none">
            <div class="card">
              <div class="card-body">
                <div class="card-icon">&#128295;</div>
                <h5 class="card-title" data-i18n="home.solutionCenter">方案中心</h5>
                <p class="card-text" data-i18n="home.solutionCenterDesc">技术方案与FAE支持</p>
              </div>
            </div>
          </a>
        </div>
        <div class="col-md-6 col-lg-3">
          <a href="contact/index.html" class="text-decoration-none">
            <div class="card">
              <div class="card-body">
                <div class="card-icon">&#128222;</div>
                <h5 class="card-title" data-i18n="home.contactUs">联系我们</h5>
                <p class="card-text" data-i18n="home.contactUsDesc">业务咨询与意见反馈</p>
              </div>
            </div>
          </a>
        </div>
      </div>
    </div>
  </section>

  <section class="intro-section">
    <div class="container" id="home-about"></div>
  </section>

  <section class="py-5">
    <div class="container">
      <h2 class="section-title" data-i18n="home.newsTitle">新闻动态</h2>
      <p class="section-subtitle" data-i18n="home.newsSubtitle">了解公司最新动态与行业资讯</p>
      <div id="home-news-container"></div>
    </div>
  </section>

  <footer class="site-footer" id="hyx-footer"></footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script src="js/data-loader.js"></script>
  <script>
    document.addEventListener('hyx-components-ready', function() {
      if (!window.HYXRenderer) return;
      var hero = document.getElementById('hero-carousel');
      if (hero) HYXRenderer.renderHeroCarousel(hero);
      var about = document.getElementById('home-about');
      if (about) HYXRenderer.renderHomeAbout(about);
      var newsContainer = document.getElementById('home-news-container');
      if (newsContainer) HYXRenderer.renderHomeNews(newsContainer);
    });
  </script>
</body>
</html>
