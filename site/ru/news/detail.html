<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../assets/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="../../assets/logo.png">
  <meta name="description" content="Новость - HYIC Technology">
  <title>Новость - HYIC Technology</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="../../css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="site-header" id="hyx-header"></header>

  <div class="page-hero">
    <div class="container">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="../../index.html" data-i18n="nav.home">Главная</a></li>
        <li class="breadcrumb-item"><a href="index.html" data-i18n="nav.news">Новости</a></li>
        <li class="breadcrumb-item active">Детали</li>
      </ol>
      <h1 data-i18n="news.title">Новости</h1>
      <p class="mb-0 opacity-90" data-i18n="news.subtitle">Новости компании, отраслевые новости</p>
    </div>
  </div>

  <main class="content-section py-5">
    <div class="container">
      <div class="row">
        <div class="col-lg-3 mb-4">
          <div class="list-group">
            <a href="index.html" class="list-group-item list-group-item-action" data-i18n="news.all">Все</a>
            <a href="company.html" class="list-group-item list-group-item-action" data-i18n="nav.dropdown.company">Новости компании</a>
            <a href="industry.html" class="list-group-item list-group-item-action" data-i18n="nav.dropdown.industry">Отраслевые новости</a>
            <a href="serving-customers.html" class="list-group-item list-group-item-action" data-i18n="nav.dropdown.servingCustomers">Обслуживание клиентов</a>
          </div>
        </div>
        <div class="col-lg-9">
          <article class="content-section">
            <header class="mb-4" id="news-detail-meta"></header>
            <div class="article-body text-muted" id="news-detail-body"></div>
          </article>
          <div class="mt-4 pt-4 border-top">
            <a href="index.html" class="btn btn-hyx-outline" data-i18n="news.backToList">Назад к списку</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="hyx-footer"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/components.js"></script>
  <script src="../../js/data-loader.js"></script>
  <script>
    document.addEventListener('hyx-components-ready', function() {
      var meta = document.getElementById('news-detail-meta');
      var body = document.getElementById('news-detail-body');
      if ((meta || body) && window.HYXRenderer) HYXRenderer.renderNewsDetail(meta, body);
    });
  </script>
</body>
</html>
