<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>内容管理 - 弘易芯科技官网</title>
  <link rel="icon" href="../assets/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/admin.css" rel="stylesheet">
</head>
<body>

  <!-- 登录视图 -->
  <div id="login-view" class="login-wrap d-none">
    <div class="card login-card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <img src="../assets/logo.png" alt="logo" class="login-logo mb-2">
          <h5 class="fw-bold mb-1">官网内容管理后台</h5>
          <div class="text-muted small">深圳市弘易芯科技有限公司</div>
        </div>
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label">用户名</label>
            <input type="text" class="form-control" id="login-username" autocomplete="username" required>
          </div>
          <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" class="form-control" id="login-password" autocomplete="current-password" required>
          </div>
          <div id="login-error" class="text-danger small mb-3 d-none"></div>
          <button type="submit" class="btn btn-primary w-100" id="login-submit">登 录</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 主视图 -->
  <div id="app-view" class="d-none">
    <nav class="topbar">
      <div class="brand">
        <button class="btn btn-sm btn-outline-light d-md-none me-2" id="sidebar-toggle" type="button" aria-label="打开或关闭侧边菜单" aria-controls="sidebar" aria-expanded="false">☰</button>
        <img src="../assets/logo.png" alt="logo">
        <span>内容管理后台</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <a href="../index.html" target="_blank" class="text-white-50 small text-decoration-none">查看官网 ↗</a>
        <span class="small" id="current-username"></span>
        <button class="btn btn-sm btn-outline-light" id="logout-btn">退出</button>
      </div>
    </nav>
    <div class="admin-layout">
      <aside class="sidebar" id="sidebar">
        <div class="nav-section">首页</div>
        <a class="nav-link" href="#/dashboard" data-page="dashboard">仪表盘</a>
        <a class="nav-link" href="#/hero" data-page="hero">轮播图片</a>
        <a class="nav-link" href="#/about" data-page="about">关于区块</a>
        <div class="nav-section">内容</div>
        <a class="nav-link" href="#/news" data-page="news">新闻管理</a>
        <a class="nav-link" href="#/news-types" data-page="news-types">新闻分类</a>
        <a class="nav-link" href="#/brands" data-page="brands">代理品牌</a>
        <a class="nav-link" href="#/distribution" data-page="distribution">分销品牌</a>
        <a class="nav-section">产品与方案</a>
        <a class="nav-link" href="#/products" data-page="products">产品列表</a>
        <a class="nav-link" href="#/product-categories" data-page="product-categories">产品分类</a>
        <a class="nav-link" href="#/diagrams" data-page="diagrams">应用框图</a>
        <div class="nav-section">站点</div>
        <a class="nav-link" href="#/config" data-page="config">站点设置</a>
        <a class="nav-link" href="#/i18n" data-page="i18n">多语言文案</a>
        <a class="nav-link" href="#/password" data-page="password">修改密码</a>
      </aside>
      <main class="admin-main" id="page-container"></main>
    </div>
  </div>

  <!-- 通用编辑弹窗 -->
  <div class="modal fade" id="editor-modal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editor-title">编辑</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="editor-form"></form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="editor-save">保存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-wrap"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
